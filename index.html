<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fish Check</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
 
<!-- LOGIN / FORGOT PASSWORD -->
<section id="auth">
  <div class="hero">
    <h1>Fish Check</h1>
    <p>Fish quality, inventory, sales and profit in one place for the General Santos City Fish Port Complex.</p>
  </div>
  <div class="panel">
    <form id="login">
      <h2>Welcome back</h2>
      <p class="mut small">Log in with your employee ID.</p>
      <label>Employee ID<input name="id" required autocomplete="username" placeholder="EMP-0001"></label>
      <label>Password
        <span class="pw"><input type="password" name="pw" required autocomplete="current-password"><button type="button" class="eye" aria-label="Show or hide password">👁</button></span>
      </label>
      <button class="btn wide">Log in</button>
      <p><button type="button" class="link" data-go="forgot">Forgot password?</button></p>
  
   
    </form>
 
    <form id="forgot" hidden>
      <h2>Reset password</h2>
      <label>Employee ID<input name="id" required></label>
      <label>New password
        <span class="pw"><input type="password" name="pw" data-pw required minlength="6" autocomplete="new-password"><button type="button" class="eye" aria-label="Show or hide password">👁</button></span>
      </label>
      <div class="meter" aria-hidden="true"><i></i></div>
      <label>Confirm password
        <span class="pw"><input type="password" name="pw2" data-pw required minlength="6" autocomplete="new-password"><button type="button" class="eye" aria-label="Show or hide password">👁</button></span>
      </label>
      <p class="gen">Generate password:
        <button type="button" class="btn ghost sm" data-gen="weak">Weak</button>
        <button type="button" class="btn ghost sm" data-gen="medium">Medium</button>
        <button type="button" class="btn ghost sm" data-gen="strong">Strong</button>
      </p>
      <button class="btn wide">Update password</button>
      <p><button type="button" class="link" data-go="login">Back to log in</button></p>
    </form>
  </div>
</section>
 
<!-- APP (filled by script.js according to the user's role) -->
<div id="app" hidden>
  <aside>
    <div class="brand"><b><svg class="i" viewBox="0 0 24 24" style="stroke:#fff"><path d="M3 12c3-5 8-6 12-4l5-2-2 5 2 5-5-2c-4 2-9 1-12-4z"/><circle cx="9" cy="11" r=".6"/></svg></b><span>Fish Check</span></div>
    <nav id="nav" aria-label="Main"></nav>
    <div id="me"></div>
    <button class="collapse" id="collapse" aria-label="Collapse menu"><svg class="i" viewBox="0 0 24 24"><path d="m11 17-5-5 5-5M18 17l-5-5 5-5"/></svg></button>
  </aside>
  <div class="shell">
    <header class="top">
      <h1 id="title"></h1>
      <time id="clock" class="clock" aria-label="Current date and time"></time>
      <button class="ib" id="theme" aria-label="Toggle dark mode"><svg class="i" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
      <button class="ib" id="logout" aria-label="Log out"><svg class="i" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg></button>
      <div class="av" id="avatar" aria-hidden="true"></div>
    </header>
    <main id="main"></main>
  </div>
</div>
 
<dialog id="dlg"><p id="dlgq">Delete this record?</p><form method="dialog" class="acts"><button class="btn ghost" value="no">Cancel</button><button class="btn danger" value="yes">Delete</button></form></dialog>
<div id="toast" role="status"></div>
<script src="script.js"></script>
</body>
</html>
